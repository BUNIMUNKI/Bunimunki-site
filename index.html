<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apprehension and Collection Bureau | BuniMunki</title>
  <meta name="description" content="Short comedy comics by BuniMunki following Lydia, Sedna, and Glepglorp (GG).">
  <meta name="keywords" content="art portfolio, webcomic, illustration, digital art">
  <meta name="author" content="BuniMunki">
  <meta property="og:title" content="Apprehension and Collection Bureau | BuniMunki">
  <meta property="og:description" content="Short comedy comics by BuniMunki following Lydia, Sedna, and Glepglorp (GG).">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#0e0f1a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Bungee:wght@400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ["Bungee", "sans-serif"],
            body: ["Baloo 2", "sans-serif"]
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-body antialiased">
  <a class="skip-link" href="#home">Skip to content</a>

  <header class="top-nav fixed top-0 z-50 w-full border-b border-white/10 backdrop-blur-lg">
    <nav class="header-shell mx-auto grid max-w-7xl items-center px-4 py-3 md:px-8" aria-label="Main navigation">
      <div class="header-left-spacer" aria-hidden="true"></div>
      <a id="brandName" href="#home" class="brand header-brand font-display tracking-wide">Apprehension and Collection Bureau</a>
      <div class="header-controls flex items-center justify-end gap-2">
        <button id="mobileNavBtn" class="btn-ghost md:hidden" aria-label="Open mobile menu" type="button">Menu</button>
      </div>
    </nav>
    <div id="mobileNav" class="mobile-nav hidden border-t border-white/10 px-4 py-3 md:hidden">
      <a href="#home" class="mobile-link">Home</a>
      <a href="gallery.html" class="mobile-link">Art Gallery</a>
      <a href="webcomic.html" class="mobile-link">Webcomics</a>
      <a href="characters.html" class="mobile-link">Characters</a>
      <a href="arcade.html" class="mobile-link">Arcade</a>
      <a href="#about" class="mobile-link">About</a>
    </div>
  </header>

  <main>
    <section id="home" class="section-pad hero relative overflow-hidden">
      <div class="hero-grid hero-mockup-grid mx-auto mt-10 max-w-7xl gap-8 px-4 md:mt-16 md:px-8">
        <div class="hero-left-stack">
          <img id="heroPinupImage" class="hero-pinup-image" src="assets/webcomic-site-futuristic-portfoliotheme-reference/frontpagelydia.png" alt="Lydia front page artwork" loading="lazy">
        </div>

        <aside class="hero-center-nav fade-in-up delay-1" aria-label="Quick links">
          <div id="copperheadFlashlight" class="hero-copperhead-flashlight" aria-hidden="true">
            <img class="hero-copperhead-image" src="assets/webcomic-site-futuristic-portfoliotheme-reference/copperhead.png" alt="Copperhead reference artwork" loading="lazy">
          </div>
          <a href="gallery.html" class="hero-quick-link">Art Gallery</a>
          <a href="webcomic.html" class="hero-quick-link">Webcomics</a>
          <a href="characters.html" class="hero-quick-link">Characters</a>
          <a href="arcade.html" class="hero-quick-link">Arcade</a>
          <a href="#about" class="hero-quick-link">About</a>
        </aside>

        <div class="hero-right-stack fade-in-up delay-1">
          <article class="comic-preview-card">
            <div class="comic-preview-header" aria-hidden="true">
              <span class="comic-preview-prefix">NEW TRANSMISSION . . .</span>
              <span id="latestComicFrameTitle" class="comic-preview-title">LOADING</span>
            </div>
            <div class="latest-comic-cover-shell">
              <img id="latestComicCover" class="latest-comic-cover" src="" alt="Latest chapter cover preview" loading="lazy">
            </div>
          </article>

          <article class="feature-card latest-comic-card">
            <p class="meta-label">Latest Comic</p>
            <h3 id="latestComicTitle" class="font-display text-lg"></h3>
            <p id="latestComicMeta" class="mt-1 text-sm"></p>
            <button id="openLatestChapterBtn" class="btn-primary mt-5" type="button">Read Now</button>
          </article>
        </div>
      </div>
    </section>

    <section id="about" class="section-pad">
      <div class="mx-auto max-w-5xl px-4 md:px-8">
        <h2 class="section-title">About</h2>
        <div class="about-card mt-6 grid gap-6 md:grid-cols-[180px_1fr] md:items-center">
          <img id="aboutPortrait" src="" alt="Artist portrait" class="about-portrait" loading="lazy">
          <div>
            <h3 id="aboutName" class="font-display text-2xl"></h3>
            <p id="aboutBio" class="mt-3 leading-7"></p>
            <ul id="aboutHighlights" class="mt-4 grid gap-2"></ul>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-white/10 py-8">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 text-sm md:px-8">
      <p id="footerText"></p>
      <a href="#home" class="nav-link">Back to top</a>
    </div>
  </footer>

  <div id="lightbox" class="modal hidden" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <div class="modal-backdrop" data-close="lightbox"></div>
    <div class="modal-panel lightbox-panel">
      <button class="modal-close" type="button" data-close="lightbox" aria-label="Close artwork viewer">x</button>
      <button id="lightboxPrev" class="modal-nav left" type="button" aria-label="Previous artwork">Prev</button>
      <img id="lightboxImage" src="" alt="Artwork full view" class="lightbox-image">
      <button id="lightboxNext" class="modal-nav right" type="button" aria-label="Next artwork">Next</button>
      <p id="lightboxCaption" class="mt-4 text-sm"></p>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
